name: Remote macOS Desktop (VNC & Web)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '테스트할 브랜치'
        required: false
        default: 'feature/macos-support'
      duration_minutes:
        description: '세션 유지 시간 (분 단위, 최대 120분)'
        required: false
        default: '60'

jobs:
  remote-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'feature/macos-support' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz nuitka ordered-set zstandard

      - name: Compile macOS C++ Module & Build DeskCal
        run: |
          python tools/build_mac.py || true

      - name: Configure macOS Console & Screen Sharing
        run: |
          # 1. 화면 잠자기 방지 및 깨우기
          caffeinate -u -d &
          
          # 2. VNC를 콘솔(Console) 데스크톱 세션에 항상 바인딩하도록 강제
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser runner
          
          # 3. runner 계정 비밀번호 설정
          sudo dscl . -passwd /Users/runner deskcal123 || true
          
          # 4. VNC 서비스 콘솔 모드로 활성화
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw deskcal123 \
            -restart -agent -console || true
          
          sudo pkill screensharingd || true

      - name: Launch DeskCal & Web Stream on macOS Desktop
        run: |
          RUNNER_UID=$(id -u runner)
          echo "Launching DeskCal into GUI session (UID $RUNNER_UID)..."
          
          # GUI 데스크톱 세션에 DeskCal 실행
          if [ -d "build/DeskCal.app" ]; then
            sudo launchctl asuser $RUNNER_UID open "build/DeskCal.app" &
          else
            sudo launchctl asuser $RUNNER_UID python3 deskcal.py &
          fi
          
          # 웹 브라우저 실시간 화면 모니터링 준비 (HTML + 캡처 루프)
          mkdir -p /tmp/web
          cat << 'EOF' > /tmp/web/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>DeskCal macOS Live Desktop</title>
            <style>
              body { background: #18181b; color: #fff; font-family: -apple-system, sans-serif; text-align: center; margin: 0; padding: 20px; }
              h1 { font-size: 22px; margin-bottom: 6px; }
              p { color: #a1a1aa; font-size: 14px; margin-bottom: 16px; }
              .screen-container { display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; border: 1px solid #3f3f46; background: #000; }
              img { display: block; max-width: 92vw; max-height: 82vh; }
              .badge { display: inline-block; background: #16a34a; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
            </style>
          </head>
          <body>
            <div class="badge">● LIVE DESKTOP STREAM</div>
            <h1>DeskCal macOS 클라우드 실시간 데스크톱 화면</h1>
            <p>2초마다 실제 맥 화면이 자동으로 새로고침됩니다. (크롬, 엣지 등 브라우저에서 바로 시청 가능)</p>
            <div class="screen-container">
              <img id="stream" src="screen.png" alt="macOS Desktop Loading...">
            </div>
            <script>
              setInterval(function() {
                var img = document.getElementById('stream');
                img.src = 'screen.png?t=' + new Date().getTime();
              }, 2000);
            </script>
          </body>
          </html>
          EOF

          # 실시간 화면 캡처 루프 (2초마다 화면을 /tmp/web/screen.png 로 저장)
          (while true; do
            sudo launchctl asuser $RUNNER_UID screencapture -x /tmp/web/screen.png 2>/dev/null || true
            sleep 2
          done) &

          # 로컬 웹 서버 가동 (포트 8080)
          cd /tmp/web && python3 -m http.server 8080 &

      - name: Install and Start ngrok Tunnels (Web & VNC)
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN || secrets.NGROK_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "❌ ERROR: NGROK_AUTH_TOKEN Secret이 비어있습니다!"
            exit 1
          fi

          if ! command -v ngrok &> /dev/null; then
            echo "Downloading ngrok for macOS arm64..."
            curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip -o /tmp/ngrok.zip
            sudo unzip -o /tmp/ngrok.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/ngrok
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"
          
          # 웹 화면 스트리밍 (HTTP 8080) 및 VNC 원격 (TCP 5900) 동시 실행
          ngrok http 8080 --log=stdout > ngrok_http.log 2>&1 &
          ngrok tcp 5900 --log=stdout > ngrok_tcp.log 2>&1 &
          
          # 터널 정보 추출 대기
          WEB_URL=""
          VNC_URL=""
          for i in {1..20}; do
            TUNNEL_INFO=$(curl -s http://127.0.0.1:4040/api/tunnels || true)
            WEB_URL=$(echo "$TUNNEL_INFO" | grep -o 'https://[^"]*\.ngrok-free\.app' | head -n 1)
            if [ -z "$WEB_URL" ]; then
              WEB_URL=$(echo "$TUNNEL_INFO" | grep -o 'https://[^"]*\.ngrok\.io' | head -n 1)
            fi
            VNC_URL=$(echo "$TUNNEL_INFO" | grep -o 'tcp://[^"]*' | head -n 1 | sed 's/tcp:\/\///')
            if [ -n "$WEB_URL" ] || [ -n "$VNC_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "=========================================================="
          echo "🎉 macOS 클라우드 화면이 완벽하게 준비되었습니다!"
          echo ""
          echo "1️⃣ [가장 편리함] 웹 브라우저(크롬/엣지)에서 바로 맥 화면 보기:"
          echo "    👉 $WEB_URL"
          echo ""
          echo "2️⃣ VNC 뷰어로 직접 조작하기:"
          echo "    👉 VNC 접속 주소: $VNC_URL"
          echo "    👉 접속 비밀번호: deskcal123"
          echo "=========================================================="

      - name: Keep Session Alive
        run: |
          MINS=${{ github.event.inputs.duration_minutes || '60' }}
          echo "원격 세션을 ${MINS}분 동안 유지합니다. 테스트가 끝나면 GitHub Actions에서 'Cancel workflow'를 누르시면 종료됩니다."
          sleep $((MINS * 60))
