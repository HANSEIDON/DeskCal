name: Test macOS

# Mac 없이 실제 macOS 러너에서 테스트 + 실행 스모크 + 스크린샷을 돌린다.
# 결과(통과/실패)는 체크로, 화면은 아티팩트(스크린샷)로 확인한다.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/macos-support
    paths:
      - 'deskcal.py'
      - 'platform_helper.py'
      - 'tests/**'
      - '.github/workflows/test-macos.yml'

jobs:
  test-macos:
    runs-on: macos-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"       # 세그폴트로 죽어도 버퍼가 날아가지 않게
      PYTHONFAULTHANDLER: "1"     # 네이티브 크래시 시 파이썬 트레이스백을 남긴다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyobjc-framework-Cocoa pyobjc-framework-Quartz

      - name: Import check (does deskcal import on macOS?)
        id: importcheck
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -c "import deskcal; print('IMPORT OK')" 2>&1 | tee import.log
          {
            echo "### Import check"
            echo '```'
            cat import.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests (cross-platform suite)
        id: tests
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p artifacts
          set -o pipefail
          python tests/test_deskcal.py 2>&1 | tee artifacts/unit_tests.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Unit tests (exit $rc)"
            echo '```'
            tail -n 40 artifacts/unit_tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: macOS native tests
        id: mactests
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p artifacts
          set -o pipefail
          python tests/test_macos_native.py 2>&1 | tee artifacts/native_tests.log
          rc=${PIPESTATUS[0]}
          {
            echo "### macOS native tests (exit $rc)"
            echo '```'
            tail -n 30 artifacts/native_tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Launch smoke test + screenshots
        id: smoke
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p artifacts
          export DESKCAL_DIR="$RUNNER_TEMP/deskcaldata"
          # 데모 데이터로 실제 화면이 차게 띄운다 (개인정보 없음)
          # Setup colorful desktop wallpaper and display background layer
          ( python tests/set_macos_wallpaper.py /tmp/wallpaper.png --serve > artifacts/wallpaper.log 2>&1 & echo $! > bg.pid ) || true
          sleep 2
          # 1. 유리 은은하게 (Glass soft) 실행 및 캡처
          ( python deskcal.py --float > artifacts/app_soft.log 2>&1 & echo $! > app.pid ) || true
          sleep 7
          if kill -0 "$(cat app.pid)" 2>/dev/null; then
            echo "alive=yes" >> "$GITHUB_OUTPUT"
            echo "APP RUNNING after 7s" | tee -a artifacts/result.txt
          else
            echo "alive=no" >> "$GITHUB_OUTPUT"
            echo "APP EXITED early (see app.log)" | tee -a artifacts/result.txt
          fi
          screencapture -x artifacts/desktop_soft.png 2>/dev/null || true
          cp -f artifacts/desktop_soft.png artifacts/desktop.png 2>/dev/null || true
          kill "$(cat app.pid)" 2>/dev/null || true
          sleep 2

          # 2. 유리 투명하게 (Glass clear) 실행 및 캡처
          python -c 'import json, os; p = os.path.join(os.environ["DESKCAL_DIR"], "config.json"); os.makedirs(os.path.dirname(p), exist_ok=True); d = json.load(open(p)) if os.path.exists(p) else {}; d["glass"] = "clear"; json.dump(d, open(p, "w"))' || true
          ( python deskcal.py --float > artifacts/app_clear.log 2>&1 & echo $! > app_clear.pid ) || true
          sleep 6
          screencapture -x artifacts/desktop_clear.png 2>/dev/null || true
          kill "$(cat app_clear.pid)" 2>/dev/null || true
          sleep 2

          # 3. 단색 모드 (Solid - glass: off) 실행 및 캡처
          python -c 'import json, os; p = os.path.join(os.environ["DESKCAL_DIR"], "config.json"); os.makedirs(os.path.dirname(p), exist_ok=True); d = json.load(open(p)) if os.path.exists(p) else {}; d["glass"] = "off"; json.dump(d, open(p, "w"))' || true
          ( python deskcal.py --float > artifacts/app_solid.log 2>&1 & echo $! > app_solid.pid ) || true
          sleep 6
          screencapture -x artifacts/desktop_solid.png 2>/dev/null || true
          kill "$(cat app_solid.pid)" 2>/dev/null || true
          kill "$(cat bg.pid)" 2>/dev/null || true
          # 크래시 로그 수집
          cp -f "$DESKCAL_DIR/crash.log" artifacts/ 2>/dev/null || true
          cp -f "$DESKCAL_DIR/error.log" artifacts/ 2>/dev/null || true

      - name: Encode result into an artifact name (readable via public API)
        if: always()
        run: |
          mkdir -p statusdir && echo ok > statusdir/status.txt
          # 실패 핵심을 base64url 로 인코딩해 아티팩트 이름에 담는다 (무인증 API 로 디코딩 가능)
          # 세그폴트 트레이스백에서 우리 코드 프레임만 (어느 파일 몇 줄 무슨 함수)
          echo "size unit=$(wc -c < artifacts/unit_tests.log 2>/dev/null) app=$(wc -c < artifacts/app.log 2>/dev/null)"
          PAYLOAD=$( { echo "FAILS:"; grep -hE '^FAIL' artifacts/unit_tests.log 2>/dev/null | head -6; echo "END:"; tail -1 artifacts/unit_tests.log 2>/dev/null; } | tr -s ' ' | head -c 185 | base64 | tr '+/' '-_' | tr -d '=\n' )
          PAYLOAD2=$( grep -hE '\[INFO\]|FAIL|Error' artifacts/native_tests.log 2>/dev/null | head -3 | head -c 170 | base64 | tr '+/' '-_' | tr -d '=\n' )
          echo "STATUS=import-${{ steps.importcheck.outcome }}__unit-${{ steps.tests.outcome }}__native-${{ steps.mactests.outcome }}__alive-${{ steps.smoke.outputs.alive }}" >> "$GITHUB_ENV"
          echo "B64=$PAYLOAD" >> "$GITHUB_ENV"
          echo "B64APP=$PAYLOAD2" >> "$GITHUB_ENV"

      - name: Upload status marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESULT__${{ env.STATUS }}
          path: statusdir/

      - name: Upload error marker (base64)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: B64__${{ env.B64 }}
          path: statusdir/

      - name: Upload app-log marker (base64)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: APP__${{ env.B64APP }}
          path: statusdir/

      - name: Upload artifacts (screenshots + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: artifacts/

      - name: Summary
        if: always()
        run: |
          {
            echo "## macOS test results"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
            echo "- macOS native tests: ${{ steps.mactests.outcome }}"
            echo "- Launch smoke (alive after 10s): ${{ steps.smoke.outputs.alive }}"
          } >> "$GITHUB_STEP_SUMMARY"
          # 단위 테스트가 실패면 잡 전체를 실패로 표시
          test "${{ steps.tests.outcome }}" = "success"
