name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '빌드할 브랜치'
        required: false
        default: 'feature/macos-support'
  push:
    branches:
      - feature/macos-support
      - feature/macos-isop-import

# 릴리스에 파일을 올릴 때만 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # 태그로 시작된 빌드는 그 태그를 그대로 빌드한다 (예전엔 항상 브랜치 끝을 빌드했다)
          ref: ${{ github.event.inputs.branch || github.ref }}
          persist-credentials: false

      # 가져오기 기능은 별도 비공개 저장소에 있다. 토큰이 설정돼 있을 때만 private/ 로 가져온다.
      # (토큰이 없는 포크 빌드는 이 단계를 건너뛰고 가져오기 없는 앱을 만든다.)
      - name: Check out private import add-on
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        if: env.PRIVATE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ secrets.PRIVATE_REPO_REF || 'main' }}
          path: private
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          pip install --upgrade pip
          pip install pillow pyinstaller pyobjc-framework-Cocoa pyobjc-framework-Quartz

      - name: Run macOS Build Pipeline (.app & .dmg)
        # 비밀 값은 이 단계에만 넘긴다. 값이 없으면(포크 등) 가져오기 없는 앱이 만들어진다.
        env:
          ISOP_APP_KEY: ${{ secrets.ISOP_APP_KEY }}
          ISOP_APP_SECRET: ${{ secrets.ISOP_APP_SECRET }}
        run: |
          python tools/build_mac.py

      - name: Upload Build Artifacts (DMG & ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: DeskCal-macOS
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256

      - name: Release Assets (Only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
